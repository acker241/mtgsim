[project]
name = "mtgsim"
version = "0.1.0"
description = "MTG Dominaria-era Standard sim: Mono-Red vs Mono-White"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
mtgsim = "mtgsim.runner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mtgsim*"]
